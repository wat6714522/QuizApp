name: Build and deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
  API_URL: https://api.pasvapotiphan.link

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: QuizApp/Backend
          - name: frontend
            context: QuizApp/Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          pull: true
          tags: ${{ env.DOCKERHUB_USER }}/quizdeck:${{ matrix.name }}-${{ env.TAG }}
          build-args: NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.DOCKERHUB_USER }}/quizdeck:${{ matrix.name }}-${{ env.TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        run: |
          IMG="$DOCKERHUB_USER/quizdeck"
          SVC="${{ matrix.name }}"
          docker tag "$IMG:$SVC-$TAG" "$IMG:$SVC-latest"
          docker push "$IMG:$SVC-$TAG"
          docker push "$IMG:$SVC-latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy through Systems Manager
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          TAG="${GITHUB_SHA::7}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "quizdeck $TAG" \
            --parameters "{\"commands\":[\"sudo -iu deploy /opt/quizdeck/deploy.sh $TAG\"]}" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query Status --output text)
          [ "$STATUS" = "Success" ]

      - name: Smoke test
        run: |
          sleep 15
          curl -fsS -o /dev/null https://pasvapotiphan.link
          code=$(curl -s -o /dev/null -w "%{http_code}" https://api.pasvapotiphan.link/api/me)
          [ "$code" = "200" ] || [ "$code" = "401" ]
